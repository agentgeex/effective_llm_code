[loggers]
keys=root,aiagent_web,test_aiagent,aiagent_background

[handlers]
keys=fileHandler,consoleHandler,test_aiagentHandler,aiagent_webHandler,aiagent_backgroundHandler

[formatters]
keys=simpleFormatter,complexFormatter

[logger_root]
level=INFO
handlers=consoleHandler


[logger_background_center]
level=INFO
handlers=consoleHandler,background_centerHandler
qualname=background_center
propagate=0


[logger_test_aiagent]
level=INFO
handlers=consoleHandler,test_aiagentHandler
qualname=test_aiagent
propagate=0

[logger_aiagent_web]
level=DEBUG
handlers=consoleHandler,aiagent_webHandler
qualname=aiagent_web
propagate=0

[logger_aiagent_background]
level=INFO
handlers=consoleHandler,aiagent_backgroundHandler
qualname=aiagent_background
propagate=0


[handler_background_centerHandler]
class=FileHandler
level=INFO
formatter=complexFormatter
suffix = "%Y-%m-%d.log"
extMatch = re.complie(r"^\d{4}-\d{2}-\d{2}.log")
args=('logs/background_center.log', 'a')



[handler_fileHandler]
class=FileHandler
level=INFO
formatter=complexFormatter
suffix = "%Y-%m-%d.log"
extMatch = re.complie(r"^\d{4}-\d{2}-\d{2}.log")
args=('logs/webapp.log', 'a')



[handler_test_aiagentHandler]
class=FileHandler
level=INFO
formatter=complexFormatter
suffix = "%Y-%m-%d.log"
extMatch = re.complie(r"^\d{4}-\d{2}-\d{2}.log")
args=('logs/test_aiagent.log', 'a')



[handler_aiagent_webHandler]
class=FileHandler
level=DEBUG
formatter=complexFormatter
suffix = "%Y-%m-%d.log"
extMatch = re.complie(r"^\d{4}-\d{2}-\d{2}.log")
args=('logs/aiagent_web.log', 'a')



[handler_aiagent_backgroundHandler]
class=FileHandler
level=INFO
formatter=complexFormatter
suffix = "%Y-%m-%d.log"
extMatch = re.complie(r"^\d{4}-\d{2}-\d{2}.log")
args=('logs/aiagent_background.log', 'a')


[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(funcName)s : %(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_complexFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(module)s - %(funcName)s : %(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S